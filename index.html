<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TimeBack" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>TimeBack Calling</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iPhone Safari 底部空白行兜底:老 iOS 不支持 100dvh(CSS 里的 @supports 会失效,
      // height:100% 又跟不上底栏收起后的可视视口)。这里用 JS 把 html/body 高度
      // 钉在当前真实可视视口上,底栏收起/展开、横竖屏切换都实时跟随——全 iOS 版本生效。
      (function () {
        var fit = function () {
          var h = window.innerHeight;
          if (h > 0) {
            document.documentElement.style.height = h + 'px';
            document.body.style.height = h + 'px';
          }
        };
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
        fit();
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
